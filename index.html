<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هو شات - بيني وبينك</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e293b; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #334155; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .left { background-color: #334155; align-self: flex-start; }
        .right { background-color: #2563eb; align-self: flex-end; }
        .input-area { display: flex; padding: 15px; background-color: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; outline: none; background-color: #0f172a; color: white; font-size: 14px; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-right: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>💬 هو شات (بيني وبينك)</header>
    <div id="chat-box">
        <div class="message left">مرحباً بكما في مساحتكما الخاصة 🚀</div>
    </div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="اكتبي رسالتك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>
    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chat-box');
            if (input.value.trim() !== '') {
                const msg = document.createElement('div');
                msg.className = 'message right';
                msg.innerText = input.value;
                chatBox.appendChild(msg);
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
