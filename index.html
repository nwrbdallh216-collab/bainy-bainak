<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة نور & عبدالله - تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .logo h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00d2ff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .logo p {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #f1f1f1;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }
        .form-group input::placeholder {
            color: #ddd;
            letter-spacing: normal;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            transform: translateY(-2px);
        }
        .footer-info {
            margin-top: 25px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <h1>🌐 Noor & Abdullah</h1>
            <p>نظام كروت الشبكة الذكية</p>
        </div>

        <!-- فورم تسجيل الدخول (يتوافق مع أنظمة المايكروتك Hotspot) -->
        <form action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="code">أدخل رقم الكرت:</label>
                <input type="text" id="code" name="username" placeholder="XXXXX-XXXXX" required autocomplete="off">
            </div>

            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>

        <div class="footer-info">
            <p>جميع الحقوق محفوظة © شبكة نور وعبدالله 2026</p>
        </div>
    </div>

</body>
</html>
